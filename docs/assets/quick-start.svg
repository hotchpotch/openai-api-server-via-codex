<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI API Server via Codex terminal quick start</title>
  <desc id="desc">A split terminal shows the server starting with uvx, a curl request returning Hello from Codex, and the corresponding 200 OK server log.</desc>

  <rect width="1400" height="900" rx="22" fill="#121019"/>
  <path d="M22 0h1356a22 22 0 0 1 22 22v42H0V22A22 22 0 0 1 22 0z" fill="#252130"/>
  <circle cx="36" cy="32" r="8" fill="#ff5f57"/>
  <circle cx="64" cy="32" r="8" fill="#febc2e"/>
  <circle cx="92" cy="32" r="8" fill="#28c840"/>
  <text x="700" y="39" text-anchor="middle" fill="#b8afc5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">openai-api-server-via-codex — quick start</text>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23">
    <text x="46" y="112" fill="#81778f">server</text>
    <text x="46" y="158" fill="#73dfa5">$</text>
    <text x="78" y="158" fill="#f7f3fb">uvx openai-api-server-via-codex</text>
    <text x="46" y="204" fill="#b8afc5">2026/08/12 12:34:56 openai-api-server-via-codex</text>
    <text x="46" y="248" fill="#dfd473">0.2.0 (Go) listening on</text>
    <text x="340" y="248" fill="#73dfa5">http://127.0.0.1:18080</text>

    <line x1="0" y1="438" x2="1400" y2="438" stroke="#40384a" stroke-width="2"/>

    <text x="46" y="490" fill="#81778f">client</text>
    <text x="46" y="536" fill="#73dfa5">$</text>
    <text x="78" y="536" fill="#f7f3fb">curl -s http://127.0.0.1:18080/v1/responses \</text>
    <text x="84" y="580" fill="#f7f3fb">-H </text>
    <text x="142" y="580" fill="#dfd473">"Content-Type: application/json"</text>
    <text x="600" y="580" fill="#f7f3fb"> \</text>
    <text x="84" y="624" fill="#f7f3fb">-d </text>
    <text x="142" y="624" fill="#dfd473">'{"model":"gpt-5.6-luna","input":"Reply with exactly: Hello from Codex!"}' \</text>
    <text x="84" y="668" fill="#f7f3fb">| jq -r </text>
    <text x="214" y="668" fill="#dfd473">'.output[0].content[0].text'</text>

    <text x="46" y="752" fill="#73dfa5">Hello from Codex!</text>
    <rect x="46" y="784" width="13" height="27" fill="#f7f3fb" opacity="0.9"/>
  </g>
</svg>
