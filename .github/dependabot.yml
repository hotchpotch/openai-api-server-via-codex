version: 2

# Security updates only. `open-pull-requests-limit: 0` disables version
# updates; security updates use a separate limit and still open PRs, which
# dependabot-auto-merge.yml merges once the required checks pass. Dependabot
# has no security updates for Docker, so Dockerfile base images are refreshed
# by hand.
updates:
  # Dependabot regenerates .github/workflows/actions.lock in the same PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
