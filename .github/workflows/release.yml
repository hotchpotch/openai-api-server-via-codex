name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      container_release_tag:
        description: Existing vX.Y.Z tag to publish to GHCR without republishing PyPI
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check release version
        id: version
        run: |
          uv run python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          if sys.version_info >= (3, 11):
              import tomllib
          else:
              import tomli as tomllib

          root = pathlib.Path(".")
          pyproject_version = tomllib.loads(root.joinpath("pyproject.toml").read_text())["project"]["version"]
          init_text = root.joinpath("openai_api_server_via_codex", "__init__.py").read_text()
          init_version = re.search(r'__version__ = "([^"]+)"', init_text).group(1)

          if pyproject_version != init_version:
              raise SystemExit(f"version mismatch: pyproject={pyproject_version} __init__={init_version}")

          ref_type = os.environ.get("GITHUB_REF_TYPE")
          ref_name = os.environ.get("GITHUB_REF_NAME")
          if ref_type == "tag" and ref_name != f"v{pyproject_version}":
              raise SystemExit(f"tag {ref_name!r} does not match package version {pyproject_version!r}")

          container_release_tag = os.environ.get("CONTAINER_RELEASE_TAG")
          if container_release_tag and container_release_tag != f"v{pyproject_version}":
              raise SystemExit(
                  f"container tag {container_release_tag!r} does not match "
                  f"package version {pyproject_version!r}"
              )

          is_prerelease = bool(
              re.search(r"(?:a|b|rc)\d+(?:\.dev\d+)?$|(?:^|\.)dev\d+$", pyproject_version)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={pyproject_version}\n")
              output.write(f"prerelease={str(is_prerelease).lower()}\n")
          PY
        env:
          CONTAINER_RELEASE_TAG: ${{ inputs.container_release_tag }}

      - name: Run validation suite
        run: uv run tox

      - name: Build distributions
        run: |
          rm -rf build dist
          uv build --wheel --no-sources
          base_wheel="$(ls dist/*-py3-none-any.whl)"
          uv run python scripts/build-platform-wheels.py \
            --wheel "${base_wheel}" \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Check package metadata
        run: uv run twine check --strict dist/*

      - name: Smoke test packaged console command
        run: |
          wheel="$(ls dist/*manylinux_2_17_x86_64.whl)"
          uv run --with "$wheel" --no-project openai-api-server-via-codex --help

      - name: Build standalone Go archives
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          uv run python scripts/build-release-archives.py \
            --wheel-dir dist \
            --output-dir release \
            --version "${{ steps.version.outputs.version }}" \
            --source-date-epoch "${source_date_epoch}"

      - name: Verify standalone Go archives
        run: |
          (cd release && sha256sum --check checksums.txt)
          mkdir release-smoke
          tar -xzf \
            "release/openai-api-server-via-codex_${{ steps.version.outputs.version }}_linux_amd64.tar.gz" \
            -C release-smoke
          release-smoke/openai-api-server-via-codex --version | \
            grep -F "${{ steps.version.outputs.version }}"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: platform-wheel-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload standalone Go archives
        uses: actions/upload-artifact@v4
        with:
          name: standalone-go-distributions
          path: release/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openai-api-server-via-codex/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: platform-wheel-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0

  publish-container:
    name: Publish multi-platform container to GHCR
    needs:
      - build
      - publish
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (
        (startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.container_release_tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.container_release_tag || github.ref }}

      - name: Resolve container source
        id: source
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          source_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          if [[ "${source_version}" != "${RELEASE_VERSION}" ]]; then
            echo "source version ${source_version} does not match release ${RELEASE_VERSION}" >&2
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && needs.build.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=openai-api-server-via-codex
            org.opencontainers.image.description=OpenAI-compatible proxy server backed by Codex HTTP credentials
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and publish container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: mode=max
          sbom: true

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
      - publish-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Generate release notes
        run: python scripts/release-notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          name: platform-wheel-distributions
          path: release-assets/

      - name: Download standalone Go archives
        uses: actions/download-artifact@v4
        with:
          name: standalone-go-distributions
          path: release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          release_flags=()
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${release_flags[@]}" \
              --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
