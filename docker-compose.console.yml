# Deployment compose for a shared host (e.g. the EC2 box that already runs other
# containers). Differs from docker-compose.yml in three ways that matter:
#
#   1. It builds the `runtime-ui` target, which bundles the Codex CLI so the
#      operator console at /ui can run the device-code sign-in itself.
#   2. It requires an API key. The console can hand over the ChatGPT account, so
#      the server refuses to serve /ui when no key is set.
#   3. It publishes beyond loopback, because the point is for another host to
#      reach it.
#
# Usage:
#   export OPENAI_VIA_CODEX_API_KEY=$(openssl rand -hex 32)
#   docker compose -f docker-compose.console.yml up -d --build
#
# Then open http://<host>:18080/ui, unlock with that key, and sign in.
#
# Exposure: publishing on 0.0.0.0 puts the console on every interface. Prefer
# binding to the private address the caller uses and let a security group do the
# rest — anyone who reaches the port and holds the key controls the account.
version: "3.8"

services:
  codex-proxy:
    build:
      context: .
      target: runtime-ui
    image: ${OPENAI_VIA_CODEX_IMAGE:-openai-api-server-via-codex:console}
    container_name: codex-proxy
    ports:
      - "${OPENAI_VIA_CODEX_BIND_HOST:-127.0.0.1}:${OPENAI_VIA_CODEX_PUBLISH_PORT:-18080}:18080"
    environment:
      # Required. Guards both /v1 and the console; without it the console is off.
      OPENAI_VIA_CODEX_API_KEY: ${OPENAI_VIA_CODEX_API_KEY:?set OPENAI_VIA_CODEX_API_KEY}
      OPENAI_VIA_CODEX_DEFAULT_MODEL: ${OPENAI_VIA_CODEX_DEFAULT_MODEL:-gpt-5.6-luna}
      OPENAI_VIA_CODEX_VERBOSE: ${OPENAI_VIA_CODEX_VERBOSE:-0}
    volumes:
      # Read-write, and owned by exactly one container: the server writes rotated
      # refresh tokens back here. Two writers rotate each other's token and break
      # the login for good, which is why this is a named volume rather than a
      # host path several containers might share.
      - codex-auth:/home/node/.codex
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-m",
          "4",
          "-o",
          "/dev/null",
          "http://127.0.0.1:18080/healthz",
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  codex-auth:
